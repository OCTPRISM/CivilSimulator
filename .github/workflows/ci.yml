name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Pytest (mock LLM, no Qdrant)
        env:
          QDRANT_ENABLED: "false"
          LLM_PROVIDER: mock
          ENV: development
        run: pytest tests/ -q

  frontend:
    name: frontend tsc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

  audit:
    name: dependency audit (P-6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: pip-audit
        working-directory: backend
        # Advisory until coordinated FastAPI / Pillow major bumps clear the board.
        # See docs/ops-secrets.md — new HIGH findings must be triaged before tag.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: npm audit (omit dev, high+)
        working-directory: frontend
        # Next 14 nests a vulnerable postcss; tracked in docs/ops-secrets.md.
        continue-on-error: true
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
