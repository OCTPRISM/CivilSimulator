<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Stone axe">
  <defs>
    <linearGradient id="haft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5A2B"/>
      <stop offset="55%" stop-color="#6B3F1A"/>
      <stop offset="100%" stop-color="#4A2C0A"/>
    </linearGradient>
    <linearGradient id="flint" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#C4C9CE"/>
      <stop offset="45%" stop-color="#8E959C"/>
      <stop offset="100%" stop-color="#5C636A"/>
    </linearGradient>
    <linearGradient id="cord" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D2A679"/>
      <stop offset="100%" stop-color="#A67C52"/>
    </linearGradient>
  </defs>
  <!-- soft badge -->
  <circle cx="64" cy="64" r="58" fill="#F4EFE4"/>
  <circle cx="64" cy="64" r="58" fill="none" stroke="#C4A574" stroke-width="2.5"/>
  <!-- wooden haft -->
  <path
    d="M74 28
       C78 36 80 48 79 62
       C78 78 74 94 68 112
       C66 116 62 116 61 112
       C66 94 70 78 71 62
       C72 48 70 36 66 28
       Z"
    fill="url(#haft)"/>
  <!-- haft grain -->
  <path d="M72 40 C74 52 74 70 71 92" stroke="#3D2409" stroke-width="1.2" opacity="0.35" fill="none"/>
  <!-- flint head -->
  <path
    d="M28 46
       L52 34
       L70 40
       L74 56
       L62 78
       L36 72
       L26 58
       Z"
    fill="url(#flint)"
    stroke="#3F4650"
    stroke-width="1.4"
    stroke-linejoin="round"/>
  <!-- flake facets -->
  <path d="M40 48 L58 42 L66 54 L52 66 Z" fill="#E8EBEE" opacity="0.35"/>
  <path d="M34 58 L48 54 L54 68 L38 70 Z" fill="#6A7178" opacity="0.28"/>
  <!-- binding cord -->
  <path d="M62 44 C70 46 74 50 72 58 C68 54 64 50 58 48 Z" fill="url(#cord)"/>
  <path d="M60 48 H74" stroke="#5C3D1E" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M59 52 H73" stroke="#5C3D1E" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M60 56 H72" stroke="#5C3D1E" stroke-width="1.6" stroke-linecap="round"/>
</svg>
